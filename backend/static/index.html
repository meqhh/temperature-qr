<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Suhu & Kelembapan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    text-align: center;
    background: #0f172a;
    color: #f1f5f9;
    padding: 40px 16px;
    margin: 0;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 24px; }
  .card {
    background: #1e293b;
    display: inline-block;
    padding: 28px 40px 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .row { display: flex; gap: 32px; justify-content: center; margin-bottom: 8px; }
  .metric { min-width: 100px; }
  .value { font-size: 2rem; font-weight: 700; }
  .label { color: #94a3b8; font-size: 0.85rem; margin-top: 2px; }
  #qrcode {
    display: inline-block;
    padding: 14px;
    background: white;
    border-radius: 14px;
    margin-top: 22px;
    line-height: 0;
  }
  #status { margin-top: 14px; font-size: 0.85rem; }
  .online { color: #4ade80; }
  .offline { color: #f87171; }
  #timestamp { color: #64748b; font-size: 0.75rem; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Monitor Suhu & Kelembapan (DHT11)</h1>
  <div class="card">
    <div class="row">
      <div class="metric">
        <div class="value" id="suhu">--</div>
        <div class="label">Suhu (°C)</div>
      </div>
      <div class="metric">
        <div class="value" id="kelembapan">--</div>
        <div class="label">Kelembapan (%)</div>
      </div>
    </div>

    <div id="qrcode"></div>
    <div id="timestamp">Belum ada data</div>
    <div id="status" class="offline">Menghubungkan...</div>
  </div>

  <script>
    const qrcode = new QRCode(document.getElementById("qrcode"), {
      text: "Menunggu data dari device...",
      width: 200,
      height: 200,
      colorDark: "#0f172a",
      colorLight: "#ffffff",
    });

    function updateQR(text) {
      qrcode.clear();
      qrcode.makeCode(text);
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${protocol}://${location.host}/ws`);

      ws.onopen = () => {
        setStatus(true);
        ws.send(JSON.stringify({ type: "hello", role: "frontend" }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "update") {
          document.getElementById("suhu").textContent = data.suhu ?? "--";
          document.getElementById("kelembapan").textContent = data.kelembapan ?? "--";
          document.getElementById("timestamp").textContent = "Update terakhir: " + data.timestamp;

          const qrPayload = JSON.stringify({
            suhu: data.suhu,
            kelembapan: data.kelembapan,
            timestamp: data.timestamp,
          });
          updateQR(qrPayload);
        }
      };

      ws.onclose = () => {
        setStatus(false);
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function setStatus(online) {
      const el = document.getElementById("status");
      el.textContent = online ? "Connected" : "Disconnected...";
      el.className = online ? "online" : "offline";
    }

    connect();
  </script>
</body>
</html>
